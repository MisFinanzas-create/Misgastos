<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Manage Your Money</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container for the entire application -->
    <div class="container">
        <!-- Header section with title -->
        <header class="header">
            <h1>💰 Expense Tracker</h1>
            <p class="subtitle">Manage your income and expenses easily</p>
        </header>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Balance overview section -->
            <section class="balance-section">
                <div class="balance-card">
                    <h2>Total Balance</h2>
                    <p class="balance-amount" id="totalBalance">$0.00</p>
                </div>

                <!-- Income and expense summaries -->
                <div class="summary-cards">
                    <div class="summary-card income">
                        <h3>Income</h3>
                        <p class="summary-amount" id="totalIncome">$0.00</p>
                    </div>
                    <div class="summary-card expense">
                        <h3>Expenses</h3>
                        <p class="summary-amount" id="totalExpense">$0.00</p>
                    </div>
                </div>
            </section>

            <!-- Form section to add new transactions -->
            <section class="form-section">
                <h2>Add Transaction</h2>
                
                <!-- Description input field -->
                <div class="form-group">
                    <label for="description">Description</label>
                    <input 
                        type="text" 
                        id="description" 
                        placeholder="Enter description (e.g., Salary, Groceries)"
                        maxlength="50"
                    >
                </div>

                <!-- Amount input field -->
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input 
                        type="number" 
                        id="amount" 
                        placeholder="Enter amount" 
                        step="0.01"
                        min="0"
                    >
                </div>

                <!-- Category selection dropdown -->
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select a category</option>
                        <option value="Salary">💼 Salary</option>
                        <option value="Freelance">🎯 Freelance</option>
                        <option value="Investment">📈 Investment</option>
                        <option value="Other Income">📌 Other Income</option>
                        <option value="Food">🍔 Food & Dining</option>
                        <option value="Transportation">🚗 Transportation</option>
                        <option value="Utilities">💡 Utilities</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Healthcare">🏥 Healthcare</option>
                        <option value="Education">📚 Education</option>
                        <option value="Other">📌 Other</option>
                    </select>
                </div>

                <!-- Transaction type (Income or Expense) -->
                <div class="form-group">
                    <label for="type">Type</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="type" value="income" checked>
                            <span>Income</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="type" value="expense">
                            <span>Expense</span>
                        </label>
                    </div>
                </div>

                <!-- Date picker for transaction date -->
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <!-- Submit button -->
                <button id="addBtn" class="btn btn-primary">Add Transaction</button>
            </section>

            <!-- Transactions list section -->
            <section class="transactions-section">
                <div class="transactions-header">
                    <h2>Transactions</h2>
                    <!-- Filter buttons -->
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="income">Income</button>
                        <button class="filter-btn" data-filter="expense">Expense</button>
                    </div>
                </div>

                <!-- Container for transaction list -->
                <div id="transactionsList" class="transactions-list">
                    <!-- Transactions will be dynamically added here -->
                    <p class="empty-message">No transactions yet. Add one to get started!</p>
                </div>

                <!-- Clear all button -->
                <button id="clearAllBtn" class="btn btn-danger btn-sm">Clear All Transactions</button>
            </section>
        </main>

        <!-- Footer section -->
        <footer class="footer">
            <p>&copy; 2024 Expense Tracker. Built with ❤️ | Manage your finances smartly</p>
        </footer>
    </div>

    <!-- Link to JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
